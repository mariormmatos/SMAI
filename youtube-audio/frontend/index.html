<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>YouTube Audio Player</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ff0000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="YT Audio" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="#ff0000">
    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-2.7A12.15 12.15 0 0 0 12 3.5a12.15 12.15 0 0 0-3.82.49 4.83 4.83 0 0 1-3.77 2.7A4.82 4.82 0 0 0 2 10.59a10 10 0 0 0 10 10 10 10 0 0 0 10-10 4.82 4.82 0 0 0-2.41-3.9zM10 15.5v-7l5 3.5z"/>
  </svg>
  <h1>YouTube Audio</h1>
</header>

<main>

  <!-- URL Input -->
  <section class="input-section">
    <div class="url-row">
      <input
        id="url-input"
        type="url"
        inputmode="url"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="https://youtube.com/watch?v=..."
      />
      <div id="spinner" class="spinner"></div>
      <button id="load-btn">Adicionar</button>
    </div>
    <div id="error-msg"></div>
  </section>

  <!-- Player -->
  <section id="player-section">

    <div class="now-playing-card">
      <img id="thumbnail" src="" alt="Thumbnail" />
      <div class="meta">
        <div id="title">—</div>
        <div id="uploader"></div>
      </div>
    </div>

    <div class="progress-area">
      <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1" />
      <div class="time-row">
        <span id="current-time">0:00</span>
        <span id="total-time">0:00</span>
      </div>
    </div>

    <div class="controls">
      <!-- Previous -->
      <button id="prev-btn" class="ctrl-btn" title="Anterior">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>

      <!-- Skip back 15s -->
      <button id="skip-back-btn" class="ctrl-btn" title="Recuar 15s">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
          <path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
          <text x="12" y="14.5" text-anchor="middle" font-size="5" fill="currentColor" font-family="system-ui">15</text>
        </svg>
      </button>

      <!-- Play/Pause -->
      <button id="play-btn" class="ctrl-btn" title="Play / Pause">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- Skip forward 30s -->
      <button id="skip-fwd-btn" class="ctrl-btn" title="Avançar 30s">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
          <path d="M18 13c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6v4l5-5-5-5v4c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8h-2z"/>
          <text x="12" y="14.5" text-anchor="middle" font-size="5" fill="currentColor" font-family="system-ui">30</text>
        </svg>
      </button>

      <!-- Next -->
      <button id="next-btn" class="ctrl-btn" title="Próximo">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/>
        </svg>
      </button>
    </div>

    <!-- Speed -->
    <div class="speed-row">
      <button class="speed-btn" data-speed="0.75">0.75×</button>
      <button class="speed-btn active" data-speed="1">1×</button>
      <button class="speed-btn" data-speed="1.25">1.25×</button>
      <button class="speed-btn" data-speed="1.5">1.5×</button>
      <button class="speed-btn" data-speed="2">2×</button>
    </div>

  </section>

  <!-- Queue -->
  <section class="queue-section">
    <div class="queue-header">
      <h2>Fila</h2>
      <button id="clear-queue-btn">Limpar</button>
    </div>
    <ul id="queue-list"></ul>
  </section>

</main>

<!-- Hidden audio element -->
<audio id="audio" preload="none"></audio>

<!-- Backend URL config — replace after Railway deploy -->
<script>window.BACKEND_URL = "";</script>
<script src="/app.js"></script>
</body>
</html>
